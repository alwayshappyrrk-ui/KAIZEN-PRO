name: Generate KAIZEN PRO Signing Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate release keystore
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/kaizen-release.jks" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -alias kaizenpro \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=KAIZEN PRO, O=Personal, C=IN"

          base64 -w 0 "$RUNNER_TEMP/kaizen-release.jks" > "$RUNNER_TEMP/keystore.base64"

      - name: Upload signing key
        uses: actions/upload-artifact@v4
        with:
          name: KAIZEN-PRO-KEYSTORE
          path: ${{ runner.temp }}/keystore.base64
          retention-days: 1
