name: Generate KAIZEN PRO Signing Key

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate release keystore
        run: |
          keytool -genkeypair \
            -keystore kaizen-release.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -alias kaizenpro \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=KAIZEN PRO, O=Personal, C=IN"

      - name: Encode keystore
        run: |
          base64 -w 0 kaizen-release.jks > keystore.base64

      - name: Upload signing key
        uses: actions/upload-artifact@v4
        with:
          name: KAIZEN-PRO-KEYSTORE
          path: keystore.base64
          retention-days: 1
