name: Build KAIZEN PRO Signed Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: gradle --no-daemon clean :app:assembleRelease

      - name: Sign release APK and verify it
        shell: bash
        run: |
          set -euo pipefail

          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$UNSIGNED"

          STORE_PASS="$(openssl rand -hex 16)"
          KEY_PASS="$STORE_PASS"
          KEYSTORE="$RUNNER_TEMP/kaizen-pro-release.jks"
          SIGNED="app/build/outputs/apk/release/KAIZEN-PRO-release-signed.apk"

          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -alias kaizenpro \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=KAIZEN PRO, O=Personal, C=IN"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias kaizenpro \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out "$SIGNED" \
            "$UNSIGNED"

          "$APKSIGNER" verify --verbose --print-certs "$SIGNED"

          echo "Signed APK:"
          ls -lh "$SIGNED"

          base64 -w 0 "$KEYSTORE" > "$RUNNER_TEMP/kaizen-pro-keystore.base64"
          printf '%s\n' "$STORE_PASS" > "$RUNNER_TEMP/kaizen-pro-keystore-password.txt"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: KAIZEN-PRO-SIGNED-RELEASE-APK
          path: app/build/outputs/apk/release/KAIZEN-PRO-release-signed.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload signing key backup
        uses: actions/upload-artifact@v4
        with:
          name: KAIZEN-PRO-SIGNING-KEY-BACKUP-PRIVATE
          path: |
            ${{ runner.temp }}/kaizen-pro-keystore.base64
            ${{ runner.temp }}/kaizen-pro-keystore-password.txt
          if-no-files-found: error
          retention-days: 1
