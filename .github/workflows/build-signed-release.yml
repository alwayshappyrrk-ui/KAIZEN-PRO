name: Build KAIZEN PRO Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate and extract Android project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="KAIZEN-PRO-V2-ALARM-DASHBOARD-FIX-STARTDATE-NOTIFICATIONS-SOURCE.zip"
          if [ ! -s "$ZIP_FILE" ]; then
            echo "::error::Required source ZIP not found: $ZIP_FILE"
            echo "Upload the intended source ZIP to the repository root with this exact name."
            exit 1
          fi
          mkdir -p android-source
          unzip -oq "$ZIP_FILE" -d android-source
          GRADLE_FILE="$(find android-source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$GRADLE_FILE" ]; then
            echo "::error::settings.gradle(.kts) not found inside source ZIP."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$GRADLE_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon clean assembleRelease

      - name: Check persistent signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Set repository Actions secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, and KEY_PASSWORD before running this workflow."
            exit 1
          fi

      - name: Sign and verify release APK with persistent key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          UNSIGNED="$PROJECT_DIR/app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED="release-output/KAIZEN-PRO-release.apk"
          test -s "$UNSIGNED"
          mkdir -p release-output
          KEYSTORE="$RUNNER_TEMP/kaizen-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias kaizenpro \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED" \
            "$UNSIGNED"
          "$APKSIGNER" verify --verbose "$SIGNED"
          ls -lh "$SIGNED"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: KAIZEN-PRO-RELEASE-APK
          path: release-output/KAIZEN-PRO-release.apk
          if-no-files-found: error
          retention-days: 7
