name: Build KAIZEN PRO Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate and extract Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="KAIZEN-PRO-V2-ALARM-FIX-SOURCE.zip"
          if [ -f "$ZIP_FILE" ]; then
            mkdir -p android-source
            unzip -o "$ZIP_FILE" -d android-source
          fi

          GRADLE_FILE="$(find . -type f -name settings.gradle -o -name settings.gradle.kts | head -n 1)"

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: settings.gradle not found."
            echo "Files available in repository:"
            find . -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLE_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon clean assembleRelease

      - name: Sign and verify release APK
        shell: bash
        run: |
          set -euo pipefail

          UNSIGNED="android-source/app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED="release-output/KAIZEN-PRO-release.apk"

          test -s "$UNSIGNED"

          mkdir -p release-output

          STORE_PASS="$(openssl rand -hex 16)"
          KEYSTORE="$RUNNER_TEMP/kaizen-release.jks"

          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storepass "$STORE_PASS" \
            -keypass "$STORE_PASS" \
            -alias kaizenpro \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=KAIZEN PRO, O=Personal, C=IN"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias kaizenpro \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$STORE_PASS" \
            --out "$SIGNED" \
            "$UNSIGNED"

          "$APKSIGNER" verify --verbose "$SIGNED"

          ls -lh "$SIGNED"
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: KAIZEN-PRO-RELEASE-APK
          path: release-output/KAIZEN-PRO-release.apk
          if-no-files-found: error
          retention-days: 7
