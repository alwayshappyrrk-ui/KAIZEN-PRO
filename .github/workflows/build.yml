name: Build KAIZEN PRO Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android source ZIP
        run: |
          test -f KAIZEN-PRO-Android-Source-JVM17-FIX.zip
          unzip -o KAIZEN-PRO-Android-Source-JVM17-FIX.zip -d .

      - name: Verify Android project
        run: |
          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts

      - name: Build Release APK
        run: |
          gradle assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: KAIZEN-PRO-RELEASE-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
