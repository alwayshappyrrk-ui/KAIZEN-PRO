name: Build KAIZEN PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android source ZIP
        run: |
          unzip -o KAIZEN-PRO-Android-Source-JVM17-FIX.zip -d .

      - name: Build APK
        run: |
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KAIZEN-PRO-APK
          path: app/build/outputs/apk/debug/*.apk
