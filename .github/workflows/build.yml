name: Build KAIZEN PRO Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android source ZIP
        run: |
          test -f KAIZEN-PRO-Android-Source-JVM17-FIX.zip
          unzip -o KAIZEN-PRO-Android-Source-JVM17-FIX.zip -d .

      - name: Verify Android project
        run: |
          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts

      - name: Build Release APK
        run: |
          gradle assembleRelease

      - name: Check APK signing status
        run: |
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$APK" ]; then
            echo "Expected unsigned APK was not found."
            find app/build/outputs/apk -type f -name "*.apk"
            exit 1
          fi
          echo "Unsigned APK found. Signing is still required."

      - name: Upload unsigned APK for diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: KAIZEN-PRO-UNSIGNED-DIAGNOSTIC
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
