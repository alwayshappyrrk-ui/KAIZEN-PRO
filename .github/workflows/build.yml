name: Build KAIZEN PRO Fresh Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check source archive
        run: test -f KAIZEN-PRO-Android-Source-FRESH.zip

      - name: Extract clean Android source
        run: unzip -o KAIZEN-PRO-Android-Source-FRESH.zip -d android-source

      - name: Build Debug APK
        working-directory: android-source
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK file and signing
        working-directory: android-source
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK size:"
          ls -lh "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload fresh Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KAIZEN-PRO-FRESH-DEBUG-APK
          path: android-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
